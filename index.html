<style>
:root{--bg:#F5F6FA;--card:#FFFFFF;--ink:#0F1222;--mute:#636A85;--line:#E3E6F0;--brand:#2F3CF0;--on-brand:#FFFFFF;--hero:#2F3CF0;--sun:#FFC83D;--soft:rgba(47,60,240,.09);--shadow:0 10px 30px rgba(15,18,34,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0F1A;--card:#151A2B;--ink:#EDEFF7;--mute:#9AA2BD;--line:#252C45;--brand:#8A93FF;--on-brand:#0C0F1A;--hero:#1B2370;--soft:rgba(138,147,255,.14);--shadow:0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0C0F1A;--card:#151A2B;--ink:#EDEFF7;--mute:#9AA2BD;--line:#252C45;--brand:#8A93FF;--on-brand:#0C0F1A;--hero:#1B2370;--soft:rgba(138,147,255,.14);--shadow:0 10px 30px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;line-height:1.55}
h1,h2,h3{font-family:'Bricolage Grotesque','Hanken Grotesk',sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:68px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--brand);color:var(--on-brand)}
.nav{display:flex;gap:4px;margin:0 auto;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:999px}
.nav button{background:transparent;border:0;color:var(--mute);padding:8px 18px;border-radius:999px;font-weight:600;font-size:.95rem}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:var(--on-brand);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--sun);color:#0F1222;font-size:.8rem}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:center;margin-top:24px;padding:56px 52px;background:var(--hero);color:#fff;border-radius:32px;overflow:hidden}
.hero h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.04;max-width:13ch}
.hero p{color:rgba(255,255,255,.8);max-width:46ch;font-size:1.05rem;margin:18px 0 26px}
.search{display:flex;max-width:480px}
.search input{flex:1;width:100%;padding:15px 22px;border:0;border-radius:999px;background:#fff;color:#0F1222;font:inherit;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.stack{position:relative;height:300px}
.stack .cover{position:absolute;width:150px;height:216px;box-shadow:0 22px 40px rgba(0,0,0,.35)}
.stack .cover:nth-child(1){left:2%;top:46px;transform:rotate(-9deg)}
.stack .cover:nth-child(2){left:32%;top:4px;transform:rotate(2deg)}
.stack .cover:nth-child(3){left:60%;top:58px;transform:rotate(11deg)}

/* books */
.sechead{display:flex;align-items:center;justify-content:space-between;margin:44px 0 16px}
.sechead h2{font-size:1.7rem}
.sechead span{color:var(--mute);font-size:.95rem}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:999px;font-weight:600;font-size:.93rem}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;padding-bottom:72px}
.item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;transition:transform .2s,box-shadow .2s}
.item:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cover{aspect-ratio:2/3;width:100%;border-radius:6px 12px 12px 6px;padding:16px 14px 14px 22px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
box-shadow:inset 7px 0 0 rgba(0,0,0,.2),inset 9px 0 0 rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.18);overflow:hidden}
.cover b{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.25rem;line-height:1.1;letter-spacing:-.01em}
.cover span{font-size:.78rem;opacity:.9}
.item h3{font-size:1.05rem;margin-top:14px}
.item .by{color:var(--mute);font-size:.9rem}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.price{font-weight:700;font-size:1.05rem}
.add{border:0;background:var(--soft);color:var(--brand);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.9rem}
.add:hover:not(:disabled){background:var(--brand);color:var(--on-brand)}
.add:disabled{opacity:.4;cursor:not-allowed}
.empty{color:var(--mute);padding:40px 0}

/* cart */
.drawer{position:fixed;inset:0 0 0 auto;width:min(400px,100%);background:var(--card);z-index:10;display:flex;flex-direction:column;padding:24px;border-radius:28px 0 0 28px;box-shadow:-20px 0 50px rgba(0,0,0,.2);
padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.45);backdrop-filter:blur(3px);z-index:9}
.drawer h2{font-size:1.4rem}
.drawer .list{flex:1;overflow:auto;margin:16px 0}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .mini{width:38px;height:54px;border-radius:3px 6px 6px 3px;flex:none}
.line div{flex:1;font-size:.93rem}
.qty{display:flex;align-items:center;gap:10px;font-weight:700}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin-bottom:14px}
.pay{width:100%;padding:14px;border:0;border-radius:999px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:1rem}
.pay:disabled{opacity:.4;cursor:not-allowed}

/* tests, admin */
.tests{padding:48px 0 72px}
.tests h1{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:8px}
.sub{color:var(--mute);margin:0 0 28px;max-width:56ch}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.tcard::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--c)}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tcard h3{font-size:1.2rem;margin-top:6px}
.tcard p{color:var(--mute);font-size:.93rem;margin:6px 0 14px}
.tbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:24px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:4px}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;max-width:680px}
.qbox h2{font-size:1.35rem;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font-weight:500}
button.opt:hover{border-color:var(--brand)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--soft);font-weight:700}
.opt.ok{border-color:#1E9E5A;background:color-mix(in srgb,#1E9E5A 14%,transparent)}
.opt.bad{border-color:#D6453A;background:color-mix(in srgb,#D6453A 12%,transparent)}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.score{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:3.4rem;color:var(--brand)}
.field{display:block;margin-bottom:14px;font-weight:600;font-size:.92rem}
.field input,.field select{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:500}
.field input[type="color"]{padding:3px;height:44px}
.err{color:#D6453A;font-weight:600;margin:12px 0 0}
.adm{max-width:900px}
.adm h2{font-size:1.35rem;margin:36px 0 12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{color:var(--mute);font-weight:600}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:8px}

.band{margin:0 0 64px}
.band .sechead{margin-top:0}
.band .grid{padding-bottom:0}
.adminband{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:28px;padding:34px 36px}
.adminband h2{font-size:1.6rem}
.adminband p{margin:6px 0 0;opacity:.75;max-width:46ch}
.adminband .pay{width:auto;padding:13px 28px;background:var(--sun);color:#0F1222}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.flinks{display:flex;gap:6px;flex-wrap:wrap}
.flinks button{background:none;border:0;color:var(--mute);font-weight:600;padding:6px 10px;border-radius:999px}
.flinks button:hover{color:var(--ink);background:var(--soft)}
.coverbtn{display:block;width:100%;padding:0;border:0;background:none;text-align:left;color:inherit;cursor:pointer}
.titlebtn{background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-align:left;cursor:pointer}
.titlebtn:hover{color:var(--brand)}
.detail{display:grid;grid-template-columns:280px 1fr;gap:44px;align-items:start;margin-top:28px}
.detail .cover{width:100%}
.detail h1{margin:10px 0 4px}
.tag{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--soft);color:var(--brand);font-weight:700;font-size:.85rem}
.bigprice{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:2rem;margin:14px 0 6px}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:8px 24px;margin:0 0 26px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta dt{color:var(--mute)}.meta dd{margin:0;font-weight:600}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.actions .pay{width:auto;padding:13px 28px}
a.add{display:inline-block;text-decoration:none}
.relh{font-size:1.5rem;margin:56px 0 16px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mute);font-size:.92rem}

@media (max-width:820px){
  .bar{flex-wrap:wrap;padding:10px 0;gap:10px}
  .logo{order:1}.cartbtn{order:2;margin-left:auto}
  .nav{order:3;width:100%;justify-content:space-between;margin:0}
  .nav button{flex:1;padding:8px 6px}
  .hero{grid-template-columns:1fr;padding:36px 24px;border-radius:26px}
  .stack{height:240px}.stack .cover{width:116px;height:167px}
  .formgrid{grid-template-columns:1fr}
  .detail{grid-template-columns:1fr;gap:24px}.detail .cover{max-width:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
